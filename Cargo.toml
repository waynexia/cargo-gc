[package]
name = "cargo-gc-bin"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Wayne Xia <waynestxia@gmail.com>"]
readme = "README.md"
repository = "https://github.com/waynexia/cargo-gc"
description = """
Garbage collect outdated cargo build artifacts.
"""

[dependencies]
anyhow = "1.0.98"
cargo_metadata = "0.17.0"
clap = { version = "4.3.24", features = ["derive"] }
humansize = "2.1.3"
indicatif = "0.17.6"
serde_json = "1.0.105"

[profile.release]
# Command-line tool: prioritize performance and a small binary. Installed via
# `cargo install`, so the extra compile time of LTO pays off for users.
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "cargo-gc"
path = "src/main.rs"
